version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./hospital_platform.db
    volumes:
      - platform_data:/app/data
    restart: unless-stopped

volumes:
  platform_data:
